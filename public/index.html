<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rocket Crash</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">R</span>
          <div>
            <strong>Rocket</strong>
            <span>Live Crash</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="connectionStatus" class="status-pill">Connecting</span>
          <span id="playerName" class="identity">Guest</span>
          <strong id="balance" class="balance">0.00</strong>
          <a class="ghost-link" href="/admin">Admin</a>
        </div>
      </header>

      <main class="game-layout">
        <section class="stage-panel">
          <div class="stage-head">
            <div>
              <span id="phaseLabel" class="phase-label">Waiting</span>
              <strong id="roundId" class="round-id">-</strong>
            </div>
            <div class="round-clock">
              <span id="clockLabel">--</span>
            </div>
          </div>
          <div class="stage">
            <canvas id="rocketCanvas" width="960" height="520" aria-label="rocket multiplier chart"></canvas>
            <div class="multiplier-readout">
              <strong id="multiplier">1.00x</strong>
              <span id="resultLabel">Place your bet</span>
            </div>
          </div>
          <div id="history" class="history-strip"></div>
        </section>

        <aside class="bet-panel">
          <form id="betForm" class="bet-form">
            <label>
              <span>Bet Amount</span>
              <input id="amountInput" type="number" min="1" step="1" value="10" />
            </label>
            <div class="chip-row">
              <button type="button" data-chip="10">10</button>
              <button type="button" data-chip="50">50</button>
              <button type="button" data-chip="100">100</button>
              <button type="button" data-chip="500">500</button>
            </div>
            <label class="switch-line">
              <input id="autoToggle" type="checkbox" />
              <span>Auto Cashout</span>
            </label>
            <label>
              <span>Cashout Multiplier</span>
              <input id="autoInput" type="number" min="1.01" step="0.01" value="2.00" disabled />
            </label>
            <button id="placeBetButton" class="primary-button" type="submit">Place Bet</button>
            <button id="cashoutButton" class="cashout-button" type="button">Cash Out</button>
          </form>

          <div class="my-bet">
            <span>My Round</span>
            <strong id="myBetStatus">No Bet</strong>
            <small id="myBetDetail">-</small>
          </div>

          <div id="message" class="message" role="status"></div>
        </aside>

        <section class="table-panel">
          <div class="section-title">
            <h2>Players This Round</h2>
            <span id="betCount">0 bets</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Player</th>
                  <th>Bet</th>
                  <th>Auto</th>
                  <th>Status</th>
                  <th>Payout</th>
                </tr>
              </thead>
              <tbody id="betsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="loginOverlay" class="overlay">
      <form id="loginForm" class="login-box">
        <div class="brand large">
          <span class="brand-mark">R</span>
          <div>
            <strong>Rocket</strong>
            <span>Enter Game</span>
          </div>
        </div>
        <label>
          <span>Player Name</span>
          <input id="usernameInput" maxlength="24" autocomplete="nickname" placeholder="Enter a name" />
        </label>
        <button class="primary-button" type="submit">Start</button>
        <p id="loginError" class="form-error"></p>
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
